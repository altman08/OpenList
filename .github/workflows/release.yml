name: Release builds

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  # Set release to prerelease first
  prerelease:
    name: Set Prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Prerelease
        uses: irongut/EditRelease@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          id: ${{ github.event.release.id }}
          prerelease: true

  # Main release job (linux/arm64 and linux/arm-7 only)
  release:
    needs: prerelease
    strategy:
      matrix:
        build-type: [ 'standard', 'lite' ]
    name: Release ${{ matrix.build-type == 'lite' && 'Lite' || '' }}
    runs-on: ubuntu-latest
    steps:

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.4'

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Install dependencies
        run: |
          sudo snap install zig --classic --beta
          # Pin xgo image to the digest used on 2026-04-30 to avoid glibc version
          # drift from the upstream ":latest" tag being rebuilt with newer glibc.
          docker pull ghcr.io/crazy-max/xgo@sha256:9897d31ff8051296e267b582ab168c903f5bcade8a5bad4879e6e16071d67500
          docker tag ghcr.io/crazy-max/xgo@sha256:9897d31ff8051296e267b582ab168c903f5bcade8a5bad4879e6e16071d67500 ghcr.io/crazy-max/xgo:latest
          docker tag ghcr.io/crazy-max/xgo@sha256:9897d31ff8051296e267b582ab168c903f5bcade8a5bad4879e6e16071d67500 crazymax/xgo:latest
          go install github.com/crazy-max/xgo@v0.37.0

      - name: Build
        run: |
          bash build.sh release ${{ matrix.build-type == 'lite' && 'lite' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in build/compress/*; do
            gh release upload "${{ github.event.release.tag_name }}" "$file" --clobber
          done
